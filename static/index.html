<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<title>在线试卷系统</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f1914'/%3E%3Cpath d='M18 18h28v28H18z' fill='none' stroke='%23f7f4ef' stroke-width='4'/%3E%3Cpath d='M24 26h16M24 32h16M24 38h10' stroke='%23f7f4ef' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
	<!-- 业务功能 14：PWA -->
	<link rel="manifest" href="/manifest.webmanifest">
	<meta name="theme-color" content="#1f1914">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<link href="/static/style.css?v=20260619-login3" rel="stylesheet">
</head>

<body>
	<script>
		window.__WEB_APP_MODE__ = true;
		window.__API_BASE__ = "/api/v1";
		// 可配置展示哪些考试族：["jlpt","eju"]、["jlpt"] 或 ["eju"]。
		window.__ENABLED_EXAM_FAMILIES__ = ["jlpt", "eju"];
		window.__EXAMS_BY_FAMILY__ = {};
		window.__EXAMS_BY_LEVEL__ = {};
	</script>

	<div id="exam-content">
		<!-- 登录弹窗 -->
		<div id="login-modal" class="login-mode-phone">
			<div class="login-box">
				<button class="login-close" type="button" data-login-close aria-label="关闭登录">×</button>
				<div class="login-brand">
					<div class="login-brand-mark">試</div>
					<div class="login-title">在线试卷</div>
				</div>

				<!-- WeChat 面板 -->
				<div class="login-panel" data-panel="wechat">
					<div class="qr-wrapper">
						<img id="wechat-qr-img" class="qr-img" src="" alt="二维码" />
					</div>
					<div id="wechat-qr-text" class="qr-hint">待扫码</div>
					<div id="wechat-status" class="login-status"></div>
					<button id="wechat-stub-btn" class="btn-stub" style="display:none">🔧 模拟扫码（开发模式）</button>
					<div id="wechat-test-id-list" class="login-test-id-list" style="display:none"></div>
					<button class="login-back-phone" type="button" data-mode="phone">手机号验证码登录</button>
				</div>

				<!-- 手机号面板 -->
				<div class="login-panel is-active" data-panel="phone">
					<div class="login-phone-entry">
						<button class="login-country-code" type="button">+86 <span>▾</span></button>
						<input id="login-phone" class="login-input login-phone-input" type="tel" placeholder="请输入手机号码" autocomplete="tel" />
					</div>
					<button id="login-btn-send-code" class="btn-primary-login login-send-code-main" disabled>发送验证码</button>
					<div class="login-code-row login-phone-code-row">
						<input id="login-phone-code" class="login-input code-input" type="text" placeholder="请输入验证码" autocomplete="one-time-code" />
						<button id="login-btn-phone-verify" class="btn-send-code">登录</button>
					</div>
				</div>

				<!-- 用户名密码面板 -->
				<div class="login-panel" data-panel="password">
					<div class="login-password-tabs">
						<button class="login-password-tab active" data-password-view="login" type="button">登录</button>
						<button class="login-password-tab" data-password-view="register" type="button">注册</button>
						<button class="login-password-tab" data-password-view="reset" type="button">找回密码</button>
					</div>
					<div class="login-password-view is-active" data-password-panel="login">
						<input id="login-username" class="login-input" type="text" placeholder="用户名 / user_id / member_no（学号/工号）/ 测试 ID" />
						<input id="login-password" class="login-input" type="password" placeholder="密码（开发测试可留空）" />
						<button id="login-btn-password" class="btn-primary-login">登录</button>
					</div>
					<div class="login-password-view" data-password-panel="register">
						<input id="register-username" class="login-input" type="text" placeholder="设置用户名" />
						<input id="register-email" class="login-input" type="email" placeholder="邮箱（可选）" />
						<input id="register-password" class="login-input" type="password" placeholder="设置密码：至少8位，含字母和数字" />
						<input id="register-password-confirm" class="login-input" type="password" placeholder="再次输入密码" />
						<button id="login-btn-register" class="btn-primary-login">注册并登录</button>
					</div>
					<div class="login-password-view" data-password-panel="reset">
						<input id="reset-login-id" class="login-input" type="text" placeholder="用户名 / 邮箱 / 手机号 / 学号" />
						<div class="login-code-row">
							<input id="reset-code" class="login-input code-input" type="text" placeholder="验证码" />
							<button id="login-btn-reset-send-code" class="btn-send-code">发送验证码</button>
						</div>
						<input id="reset-new-password" class="login-input" type="password" placeholder="新密码：至少8位，含字母和数字" />
						<button id="login-btn-reset-password" class="btn-primary-login">重置并登录</button>
					</div>
					<button class="login-back-phone" type="button" data-mode="phone">手机号验证码登录</button>
				</div>

				<div id="login-error" class="login-error" style="display:none"></div>

				<!-- 底部同意协议 -->
				<div class="login-agree">
					<label><input type="checkbox" checked /> <span>我已阅读并同意</span> <a href="#">《用户协议》</a> <span>和</span> <a href="#">《隐私政策》</a></label>
				</div>

				<!-- 模式切换图标 -->
				<div class="login-mode-bar">
					<button class="login-mode-icon login-password-shortcut" data-mode="password" title="用户名密码登录">
						<span class="login-mode-symbol" aria-hidden="true">
							<svg viewBox="0 0 24 24" focusable="false">
								<circle cx="7.5" cy="14.5" r="3.5"></circle>
								<path d="M10.2 11.8 18 4"></path>
								<path d="M15.4 6.6 17.4 8.6"></path>
								<path d="M13.2 8.8 15.2 10.8"></path>
							</svg>
						</span>
						<span>密码登录</span>
					</button>
					<button class="login-mode-icon login-social-icon login-wechat-icon" data-mode="wechat" title="微信扫码登录" aria-label="微信登录">
						<svg viewBox="0 0 576 512" aria-hidden="true" focusable="false">
							<path fill-rule="evenodd" clip-rule="evenodd" d="M385.2 167.6c6.4 0 12.6.3 18.8 1.1C387.4 90.3 303.3 32 207.7 32 100.5 32 13 104.8 13 197.4c0 53.4 29.3 97.5 78.2 130.8l-19.3 58.6 68.7-34.1c24.4 7.1 43.7 9.7 68.2 9.7 6.2 0 12.1-.3 18.3-.8-3.9-12.9-6.2-26.6-6.2-40.8-.1-84.9 73.3-153.2 164.3-153.2ZM278.6 114.2c14.5 0 24.2 9.7 24.2 24.4 0 14.5-9.7 24.2-24.2 24.2-14.8 0-29.3-9.7-29.3-24.2.1-14.7 14.6-24.4 29.3-24.4Zm-136.4 48.6c-14.5 0-29.3-9.7-29.3-24.2 0-14.8 14.8-24.4 29.3-24.4 14.8 0 24.4 9.7 24.4 24.4 0 14.6-9.6 24.2-24.4 24.2ZM563 319.4c0-77.9-77.2-141.3-163.8-141.3-91.2 0-164.3 63.4-164.3 141.3s73.1 141.3 164.3 141.3c19.3 0 38.9-5.1 58.6-9.9l53.4 29.3-14.8-48.6C535.3 402.1 563 363.2 563 319.4Zm-216.2-24.5c-9.7 0-19.3-9.7-19.3-19.6 0-9.7 9.7-19.3 19.3-19.3 14.8 0 24.4 9.7 24.4 19.3 0 10-9.7 19.6-24.4 19.6Zm106.9 0c-9.7 0-19.3-9.7-19.3-19.6 0-9.7 9.7-19.3 19.3-19.3 14.8 0 24.4 9.7 24.4 19.3.1 10-9.6 19.6-24.4 19.6Z"/>
						</svg>
					</button>
					<button class="login-mode-icon login-social-icon" data-oauth="google" title="使用 Google 登录"><span>G</span></button>
				</div>
			</div>
		</div>
		<div id="exam-workarea">
			<div id="exam-library-panel">
				<select id="exam-family-select" class="btn-secondary" autocomplete="off">
					<option value="jlpt">JLPT</option>
				</select>
				<select id="exam-level-select" class="btn-secondary" autocomplete="off">
					<option value="N1">N1</option>
					<option value="N2">N2</option>
					<option value="N3">N3</option>
					<option value="N4">N4</option>
					<option value="N5">N5</option>
				</select>
				<select id="exam-paper-select" class="btn-secondary" data-level="N1" autocomplete="off">
					<option value="">-</option>
				</select>
				<button id="theme-toggle" class="btn-secondary" title="切换主题">
					<span class="theme-icon">🌙</span>
					<span class="theme-text">深色</span>
				</button>
			</div>

			<div id="exam-header"></div>

			<div id="exam-controls" class="toolbar-grid">
				<button id="toggle-answers" class="btn-secondary">答案解析</button>
				<button id="open-question-map" class="btn-secondary" title="题目选择面板">答题卡</button>
				<button id="top-prev" class="btn-secondary" title="上一题(←)">上一题</button>
				<button id="top-next" class="btn-secondary" title="下一题(→)">下一题</button>
				<button id="toggle-explanations" class="btn-secondary">补充解析</button>
				<button id="toggle-reading-kana" class="btn-secondary" title="阅读原文上方显示假名">假名</button>
				<button id="toggle-reading-zh" class="btn-secondary" title="阅读原文下方显示中文">中文</button>
				<div class="category-slot" data-slot="1"></div>
				<div class="category-slot" data-slot="2"></div>
				<div class="category-slot" data-slot="3"></div>
				<div class="category-slot" data-slot="4"></div>
			</div>

			<div id="category-navigation" style="display:none"></div>
			<div id="section-navigation"></div>

			<div id="width-control" title="拖动调整内容最大宽度">
				<input id="width-slider" type="range" min="0" max="1800" step="10" />
			</div>

			<div id="current-question-container"></div>
			<div id="question-navigation"></div>
		</div>
	</div>

	<script type="module" src="/static/app/main.js?v=20260503b"></script>

	<script>
		(function() {
			const themeToggle = document.getElementById('theme-toggle');
			const themeIcon = themeToggle.querySelector('.theme-icon');
			const themeText = themeToggle.querySelector('.theme-text');
			const body = document.body;

			const savedTheme = localStorage.getItem('exam-theme') || 'dark';
			if (savedTheme === 'light') {
				body.classList.add('light-theme');
				themeIcon.textContent = '☀️';
				themeText.textContent = '浅色';
			} else {
				themeIcon.textContent = '🌙';
				themeText.textContent = '深色';
			}

			themeToggle.addEventListener('click', function() {
				body.classList.toggle('light-theme');
				const isLight = body.classList.contains('light-theme');
				themeIcon.textContent = isLight ? '☀️' : '🌙';
				themeText.textContent = isLight ? '浅色' : '深色';
				localStorage.setItem('exam-theme', isLight ? 'light' : 'dark');
			});
		})();
	</script>
</body>
</html>
