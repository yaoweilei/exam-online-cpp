			<div id="current-question-container" aria-busy="true"><div style="padding:40px;text-align:center;color:#888;">正在准备试卷，请稍候…</div></div>

	</div>

	<script type="module" src="/static/app/main.js?v=20261002-practice-close-v1"></script>

	<script>
		(function() {
			const themeToggle = document.getElementById('theme-toggle');
			const themeIcon = themeToggle.querySelector('.theme-icon');
			const themeModeSelect = document.getElementById('theme-mode-select');
			const themeColor = document.querySelector('meta[name="theme-color"]');
			const systemDarkMode = window.matchMedia('(prefers-color-scheme: dark)');
			const body = document.body;
			let themeMode = 'system';
			const updateThemeButton = (isLight, mode) => {
				themeIcon.textContent = isLight ? '☀️' : '🌙';
				const actionLabel = mode === 'system'
					? `当前跟随系统（${isLight ? '浅色' : '深色'}），点击切换到${isLight ? '深色' : '浅色'}模式`
					: (isLight ? '切换到深色模式' : '切换到浅色模式');
				themeToggle.title = actionLabel;
				themeToggle.setAttribute('aria-label', actionLabel);
			};
			const applyTheme = (mode, persist) => {
				themeMode = ['light', 'dark', 'system'].includes(mode) ? mode : 'system';
				const isLight = themeMode === 'light' || (themeMode === 'system' && !systemDarkMode.matches);
				body.classList.toggle('light-theme', isLight);
				themeModeSelect.value = themeMode;
				if (themeColor) themeColor.setAttribute('content', isLight ? '#f8f6f3' : '#1f1914');
				updateThemeButton(isLight, themeMode);
				if (persist) localStorage.setItem('exam-theme', themeMode);
			};

			applyTheme(localStorage.getItem('exam-theme') || 'system', false);

			themeToggle.addEventListener('click', function() {
				applyTheme(body.classList.contains('light-theme') ? 'dark' : 'light', true);
			});

			themeModeSelect.addEventListener('change', function() {
				applyTheme(themeModeSelect.value, true);
			});

			const applySystemTheme = function() {
				if (themeMode === 'system') applyTheme('system', false);
			};
			if (typeof systemDarkMode.addEventListener === 'function') {
				systemDarkMode.addEventListener('change', applySystemTheme);
			} else if (typeof systemDarkMode.addListener === 'function') {
				systemDarkMode.addListener(applySystemTheme);
			}
		})();
	</script>
</body>
