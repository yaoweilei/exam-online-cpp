	<script>
		(function() {
			const themeToggle = document.getElementById('theme-toggle');
			const themeIcon = themeToggle.querySelector('.theme-icon');
			const body = document.body;
			const updateThemeButton = (isLight) => {
				themeIcon.textContent = isLight ? '☀️' : '🌙';
				const actionLabel = isLight ? '切换到深色模式' : '切换到浅色模式';
				themeToggle.title = actionLabel;
				themeToggle.setAttribute('aria-label', actionLabel);
			};

			const savedTheme = localStorage.getItem('exam-theme') || 'light';
			if (savedTheme === 'light') {
				body.classList.add('light-theme');
			}
			updateThemeButton(savedTheme === 'light');

			themeToggle.addEventListener('click', function() {
				body.classList.toggle('light-theme');
				const isLight = body.classList.contains('light-theme');
				updateThemeButton(isLight);
				localStorage.setItem('exam-theme', isLight ? 'light' : 'dark');
			});
		})();
	</script>
